<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFIS Biometric & Forensic Laboratory Suite</title>
    <style>
        :root {
            --bg-primary: #080c14;
            --panel-bg: #111827;
            --panel-border: #1f2937;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 380px 440px;
            gap: 24px;
            max-width: 860px;
            width: 100%;
        }

        @media (max-width: 820px) {
            .workspace { grid-template-columns: 100%; }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .canvas-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        canvas {
            background-color: #020408;
            border-radius: 6px;
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        label span { color: var(--text-main); font-weight: 600; }

        select, input[type="range"] {
            width: 100%;
            padding: 8px 10px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        input[type="range"] { accent-color: var(--accent); cursor: pointer; padding: 0; }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkbox-group input { width: 16px; height: 16px; accent-color: var(--accent); }

        .btn-primary {
            background: var(--accent);
            color: #06111f;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .btn-primary:hover { opacity: 0.9; box-shadow: 0 0 12px var(--accent-glow); }

        .telemetry {
            background: #060911;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            line-height: 1.4;
        }

        .telemetry-row { display: flex; justify-content: space-linejoin; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <h1>AFIS Laboratory Workstation</h1>
        <div class="subtitle">Procedural Dermatoglyphic Field Engine & Minutiae Extraction Matrix</div>
    </header>

    <div class="workspace">
        <!-- Visual Display Card -->
        <div class="card canvas-card">
            <canvas id="fpCanvas" width="380" height="460"></canvas>
            <div style="width: 100%; margin-top: 15px;">
                <div class="telemetry" id="telemetryData">
                    <div class="telemetry-row"><span>STATUS:</span> <span style="color:var(--success)">SYNTHESIS COMPLETE</span></div>
                    <div class="telemetry-row"><span>MODEL:</span> <span>GABOR ORIENTATION FIELD v2.4</span></div>
                    <div class="telemetry-row"><span>MINUTIAE DETECTED:</span> <span id="minutiaeCountVal">0</span></div>
                    <div class="telemetry-row"><span>CORE / DELTA:</span> <span id="singularityVal">1 Core / 1 Delta</span></div>
                </div>
            </div>
        </div>

        <!-- Controls Card -->
        <div class="card controls-card">
            <div class="section-title">Pattern Classification</div>
            <div class="control-group">
                <label for="patternSelect">Dermatoglyphic Type</label>
                <select id="patternSelect">
                    <option value="loop_left">Loop - Ulnar / Radial (Left Bias)</option>
                    <option value="loop_right" selected>Loop - Ulnar / Radial (Right Bias)</option>
                    <option value="whorl">Whorl - Concentric Spiral</option>
                    <option value="arch">Plain Arch / Tented</option>
                </select>
            </div>

            <div class="section-title">Morphological Parameters</div>
            <div class="control-group">
                <label for="frequencySlider">Ridge Spatial Frequency (Density) <span id="freqVal">11</span></label>
                <input type="range" id="frequencySlider" min="8" max="18" value="11" step="1">
            </div>

            <div class="control-group">
                <label for="pressureSlider">Matrix Imprint Pressure <span id="pressureVal">65%</span></label>
                <input type="range" id="pressureSlider" min="20" max="100" value="65">
            </div>

            <div class="control-group">
                <label for="noiseSlider">Sub-surface Skin Elasticity Noise <span id="noiseVal">20%</span></label>
                <input type="range" id="noiseSlider" min="0" max="60" value="20">
            </div>

            <div class="section-title">Forensic Overlays</div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="showMinutiae" checked>
                <label for="showMinutiae" style="display:inline; color:var(--text-main)">Extract Minutiae Map (Endings & Bifurcations)</label>
            </div>

            <div class="control-group checkbox-group">
                <input type="checkbox" id="showCoreDelta" checked>
                <label for="showCoreDelta" style="display:inline; color:var(--text-main)">Render Singularities (Core [c] / Delta [Δ])</label>
            </div>

            <div class="control-group">
                <label for="themeSelect">Color Spectrum Mode</label>
                <select id="themeSelect">
                    <option value="afis">AFIS Forensic Cyan</option>
                    <option value="ink">Standard Card Ink (Monochrome)</option>
                    <option value="uv">UV Light Fluorescence</option>
                </select>
            </div>

            <button class="btn-primary" id="recomputeBtn">Re-Synthesize Biometric Print</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fpCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const patternSelect = document.getElementById('patternSelect');
        const frequencySlider = document.getElementById('frequencySlider');
        const pressureSlider = document.getElementById('pressureSlider');
        const noiseSlider = document.getElementById('noiseSlider');
        const showMinutiaeCheck = document.getElementById('showMinutiae');
        const showCoreDeltaCheck = document.getElementById('showCoreDelta');
        const themeSelect = document.getElementById('themeSelect');
        const recomputeBtn = document.getElementById('recomputeBtn');

        // Telemetry readout labels
        const freqVal = document.getElementById('freqVal');
        const pressureVal = document.getElementById('pressureVal');
        const noiseVal = document.getElementById('noiseVal');
        const minutiaeCountVal = document.getElementById('minutiaeCountVal');
        const singularityVal = document.getElementById('singularityVal');

        function getThemeConfig(theme) {
            switch(theme) {
                case 'ink':
                    return { bg: '#f4f4f5', ridge: '#09090b', minutiae: '#dc2626', core: '#2563eb', delta: '#9333ea', glow: 'transparent' };
                case 'uv':
                    return { bg: '#021008', ridge: '#34d399', minutiae: '#f87171', core: '#60a5fa', delta: '#c084fc', glow: 'rgba(52, 211, 153, 0.35)' };
                case 'afis':
                default:
                    return { bg: '#020408', ridge: '#38bdf8', minutiae: '#fb7185', core: '#34d399', delta: '#f472b6', glow: 'rgba(56, 189, 248, 0.3)' };
            }
        }

        // Fast hash noise function for epidermal micro-texture variations
        function proceduralNoise(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function computeFingerprint() {
            const width = canvas.width;
            const height = canvas.height;
            const pattern = patternSelect.value;
            const freq = parseInt(frequencySlider.value);
            const pressure = parseInt(pressureSlider.value) / 100;
            const noise = parseInt(noiseSlider.value) / 100;
            const theme = getThemeConfig(themeSelect.value);

            // Update UI readout values
            freqVal.innerText = freq;
            pressureVal.innerText = Math.round(pressure * 100) + '%';
            noiseVal.innerText = Math.round(noise * 100) + '%';

            // Clear screen
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = theme.ridge;
            ctx.shadowColor = theme.glow;
            ctx.shadowBlur = theme.glow !== 'transparent' ? 3 : 0;
            ctx.lineWidth = 1.6 * pressure;

            const cx = width / 2;
            const cy = height / 2 + 10;
            
            // Singularities coordinates tracking
            let coreX = cx, coreY = cy - 20;
            let deltaX = cx - 40, deltaY = cy + 90;

            if (pattern === 'loop_left') { coreX = cx - 15; deltaX = cx + 50; }
            if (pattern === 'loop_right') { coreX = cx + 15; deltaX = cx - 50; }
            if (pattern === 'whorl') { coreX = cx; deltaX = cx - 60; }
            if (pattern === 'arch') { coreX = cx; deltaY = cy + 120; }

            // Mathematical Vector Field Line Generator
            const stepsPerRidge = 180;
            const totalMaxRadius = 180;

            let calculatedMinutiae = [];

            for (let r = 12; r < totalMaxRadius; r += (20 / (freq / 10))) {
                ctx.beginPath();
                let pointsInLine = 0;
                let lastValidX = null, lastValidY = null;

                for (let i = 0; i <= stepsPerRidge; i++) {
                    let theta = (i / stepsPerRidge) * Math.PI * 2;
                    let x = 0, y = 0;

                    // Complex orientation calculations based on pattern topology
                    if (pattern === 'whorl') {
                        let spiralAngle = theta * 2;
                        let modR = r + Math.sin(spiralAngle) * 4;
                        x = cx + modR * Math.cos(theta);
                        y = cy + (modR * 0.85) * Math.sin(theta);
                    } else if (pattern.includes('loop')) {
                        let dirFactor = pattern === 'loop_left' ? -1 : 1;
                        let shiftX = dirFactor * 20;
                        x = cx + shiftX + r * Math.cos(theta) + Math.sin(theta * 2) * 6;
                        y = cy + (r * 0.75) * Math.sin(theta) - (r * 0.15);
                    } else if (pattern === 'arch') {
                        let archHeightFactor = Math.sin(theta) * (r * 0.25);
                        x = cx + r * Math.cos(theta);
                        y = cy + (r * 0.55) * Math.sin(theta) - archHeightFactor - (r * 0.1);
                    }

                    // Apply skin elasticity pseudo-noise displacement
                    if (noise > 0) {
                        let nx = (proceduralNoise(x, y) - 0.5) * noise * 8;
                        let ny = (proceduralNoise(y, x) - 0.5) * noise * 8;
                        x += nx;
                        y += ny;
                    }

                    // Elliptical boundary mask simulating natural fingertip margins
                    let normX = (x - cx) / (width * 0.40);
                    let normY = (y - cy) / (height * 0.42);
                    let ellipseDist = (normX * normX) + (normY * normY);

                    if (ellipseDist <= 1.0) {
                        // Pressure fade simulation near outer boundaries
                        if (ellipseDist > 0.8) {
                            ctx.globalAlpha = Math.max(0.2, pressure * (1.0 - (ellipseDist - 0.8) * 4));
                        } else {
                            ctx.globalAlpha = pressure;
                        }

                        if (pointsInLine === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }

                        // Collect structural minutiae points (bifurcations & ridge endings) deterministically
                        if (showMinutiaeCheck.checked && i === Math.floor(stepsPerRidge * 0.4) && r % 3 === 0) {
                            calculatedMinutiae.push({ x: x, y: y, type: r % 6 === 0 ? 'Bifurcation' : 'Ending' });
                        }

                        lastValidX = x;
                        lastValidY = y;
                        pointsInLine++;
                    }
                }
                ctx.stroke();
                ctx.globalAlpha = 1.0; // Reset alpha
            }

            // Render Core and Delta Singularities
            if (showCoreDeltaCheck.checked) {
                ctx.shadowBlur = 0;
                
                // Draw Core [C]
                ctx.fillStyle = theme.core;
                ctx.beginPath();
                ctx.arc(coreX, coreY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Delta [Δ] (For loops and whorls)
                if (pattern !== 'arch') {
                    ctx.fillStyle = theme.delta;
                    ctx.beginPath();
                    ctx.moveTo(deltaX, deltaY - 5);
                    ctx.lineTo(deltaX - 5, deltaY + 4);
                    ctx.lineTo(deltaX + 5, deltaY + 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // Render Extracted Minutiae Mapping Markers
            if (showMinutiaeCheck.checked) {
                ctx.shadowBlur = 0;
                calculatedMinutiae.forEach((m, index) => {
                    ctx.strokeStyle = theme.minutiae;
                    ctx.fillStyle = theme.minutiae;
                    ctx.lineWidth = 0.8;

                    // Bounding marker box or circle
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 3.5, 0, Math.PI * 2);
                    ctx.stroke();

                    // Mini forensic analytical callout vector
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x + 8, m.y - 8);
                    ctx.stroke();
                });
                minutiaeCountVal.innerText = calculatedMinutiae.length + " vectors mapped";
            } else {
                minutiaeCountVal.innerText = "Hidden / Disabled";
            }

            // Update telemetry data description text
            if (pattern === 'whorl') {
                singularityVal.innerText = "2 Cores / 2 Deltas (Whorl)";
            } else if (pattern.includes('loop')) {
                singularityVal.innerText = "1 Core / 1 Delta (Loop)";
            } else {
                singularityVal.innerText = "0 Cores / 0 Deltas (Arch)";
            }
        }

        // Event Listeners for Real-time Reactive Computing
        recomputeBtn.addEventListener('click', computeFingerprint);
        patternSelect.addEventListener('change', computeFingerprint);
        frequencySlider.addEventListener('input', computeFingerprint);
        pressureSlider.addEventListener('input', computeFingerprint);
        noiseSlider.addEventListener('input', computeFingerprint);
        showMinutiaeCheck.addEventListener('change', computeFingerprint);
        showCoreDeltaCheck.addEventListener('change', computeFingerprint);
        themeSelect.addEventListener('change', computeFingerprint);

        // Initial generation execution on load
        computeFingerprint();
    </script>
</body>
</html>
